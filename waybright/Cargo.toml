[package]
name = "waybright"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
authors.workspace = true

[[bin]]
name = "waybright"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.1", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.20"
waydark = { path = "../waydark" }
waydim = { path = "../waydim" }
wayfocus = { path = "../wayfocus" }

[dev-dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland"] }
