[package]
name = "waybright"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
authors.workspace = true

[[bin]]
name = "waybright"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ddc = "0.2.2"
ddc-i2c = { version = "0.2.2", features = ["with-linux"], default-features = false }
dbus = "0.9.9"
serde_json = "1.0.150"
wayfocus = { path = "../wayfocus" }
waylevel = { path = "../waylevel" }
